<div class="header">
  <h2>Material Theme Builder</h2>
  Use this page to build a custom Angular Material theme using custom colors,
  typography, and density settings. The theme can be exported using the Export
  button at the bottom of the page.
</div>

<div class="page">
  <div class="control-panel">
    <h3>Color</h3>
    <div class="color-picker">
      <input type="color" id="primary-color" name="primary color" value="#e66465" />
      <label for="primary-color">Primary color</label>
    </div>
  </div>
  <div class="demo">
    <button mat-raised-button>Create</button>
  </div>
</div>
